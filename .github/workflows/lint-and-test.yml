name: Lint and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate configs and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Validate YAML
        run: python3 scripts/validate-yaml.py

      - name: Validate JSON/JSONC
        run: python3 scripts/validate-json.py

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './scripts'

  quality:
    name: Quality gates (devcontainer)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create mount stubs for CI
        run: |
          mkdir -p "$HOME/.ssh" "$HOME/.gnupg"
          touch "$HOME/.gitconfig"

      - name: Run all quality gates
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          runCmd: scripts/quality.sh all

      - name: Verify tests passed
        run: |
          if [ ! -f coverage.xml ]; then
            echo "Tests failed — no coverage report generated"
            exit 1
          fi
          FAILURES=$(grep -oP 'failures="\K\d+' test-results.xml || echo "1")
          ERRORS=$(grep -oP 'errors="\K\d+' test-results.xml || echo "1")
          if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
            echo "Tests had failures=$FAILURES errors=$ERRORS"
            exit 1
          fi
          echo "All tests passed (failures=$FAILURES errors=$ERRORS)"
