name: Python safety check

on:
  push:

env:
  DEP_PATH: ./requirements.txt

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
    steps:
      - name: Check out master
        uses: actions/checkout@v7.0.1

      - name: Skip Safety scan when no API key is configured
        if: ${{ env.SAFETY_API_KEY == '' }}
        run: echo "Safety scan skipped because SAFETY_API_KEY is not configured."

      - name: pyupio/safety-action
        if: ${{ env.SAFETY_API_KEY != '' }}
        uses: pyupio/safety-action@v1.0.1
        with:
          api-key: ${{ env.SAFETY_API_KEY }}
