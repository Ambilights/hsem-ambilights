version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    # Home Assistant pins Voluptuous exactly. Update both together when that pin changes.
    ignore:
      - dependency-name: voluptuous
    groups:
      python-dependencies:
        patterns:
          - "*"
